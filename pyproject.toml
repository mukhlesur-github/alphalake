[project]
name = "alphalake"
version = "0.1.0"
description = "AlphaLake: asset-management data & GenAI platform on Snowflake + AWS (3-day MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "faker>=30",
    "pymupdf>=1.24",
    "boto3>=1.35",
    "snowflake-connector-python[pandas]>=3.12",
    "cryptography>=43",
    "langgraph>=0.2",
    "sqlglot>=25",
    "streamlit>=1.39",
    "altair>=5",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
dbt = ["dbt-snowflake>=1.8"]

[project.scripts]
alphalake = "alphalake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalake"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
